name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Uji E2E & Audit Tab
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: E2E test + audit tab
        run: |
          set -e
          node backend/seed.js --force --full
          nohup node backend/index.js > server.log 2>&1 &
          echo $! > server.pid
          ok=0
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/api/health; then ok=1; break; fi
            sleep 1
          done
          if [ "$ok" -ne 1 ]; then
            echo "Server tidak sehat:"; cat server.log
            exit 1
          fi
          node e2e-test.js
          node tab-audit.js
          kill "$(cat server.pid)" || true

  deploy-vercel:
    name: Deploy ke Vercel
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
    steps:
      - name: Trigger Vercel Deploy Hook
        if: env.VERCEL_DEPLOY_HOOK != ''
        run: curl -fsS -X POST "$VERCEL_DEPLOY_HOOK"

      - name: Hook belum diatur
        if: env.VERCEL_DEPLOY_HOOK == ''
        run: echo "::notice::Tambahkan secret VERCEL_DEPLOY_HOOK (Vercel → Project → Settings → Git → Deploy Hooks) agar auto-deploy Vercel aktif."
