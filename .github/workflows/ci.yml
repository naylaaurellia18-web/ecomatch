name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Uji E2E & Audit Tab
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: E2E test + audit tab
        run: |
          set -e
          node backend/seed.js --force --full
          nohup node backend/index.js > server.log 2>&1 &
          echo $! > server.pid
          ok=0
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/api/health; then ok=1; break; fi
            sleep 1
          done
          if [ "$ok" -ne 1 ]; then
            echo "Server tidak sehat:"; cat server.log
            exit 1
          fi
          node e2e-test.js
          node tab-audit.js
          kill "$(cat server.pid)" || true

  deploy-railway:
    name: Deploy Backend ke Railway
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Railway up
        if: env.RAILWAY_TOKEN != ''
        run: |
          npm install -g @railway/cli
          railway up --service food-rescue-ai --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Token belum diatur
        if: env.RAILWAY_TOKEN == ''
        run: echo "::notice::Tambahkan secret RAILWAY_TOKEN di Settings → Secrets → Actions agar auto-deploy Railway aktif."
