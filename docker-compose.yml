services:
  postgis:
    image: postgis/postgis:16-3.4
    container_name: ecomatch-postgis
    environment:
      POSTGRES_DB: ecomatch
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ecomatch
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ecomatch"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  pgdata:
