<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>EcoMatch — AI Routing Sampah Makanan MBG</title>
  <meta name="description" content="Platform pengalihan sampah makanan MBG ke TPS pengolah berbasis AI routing dan peta GIS." />
  <meta name="theme-color" content="#16a34a" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="EcoMatch" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <link rel="stylesheet" href="/styles.css" />
  <script src="/theme.js"></script>
</head>
<body>
  <div id="app">
    <div id="authRoot"></div>

    <div class="app-shell" id="appLayout" hidden>
      <div class="backdrop" id="sidebarOverlay"></div>

      <aside class="sidebar" id="sidebar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/></svg>
          </span>
          <div class="brand-text">
            <strong>EcoMatch</strong>
            <span>AI Routing Sampah Makanan MBG</span>
          </div>
        </div>

        <nav class="nav" id="nav" aria-label="Menu utama"></nav>

        <div class="side-foot">
          <div class="avatar" id="userAvatar"></div>
          <div class="side-user">
            <div class="side-name" id="userName"></div>
            <div class="side-meta"><span class="pill" id="userRole"></span></div>
          </div>
          <button class="icon-btn logout" type="button" data-logout title="Keluar" aria-label="Keluar">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg>
          </button>
        </div>
      </aside>

      <div class="main-col">
        <header class="topbar">
          <button class="icon-btn menu-btn" id="menuToggle" type="button" aria-label="Buka menu">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="18" y2="18"/></svg>
          </button>
          <div class="topbar-title" id="topbarTitle">Beranda</div>
          <div class="topbar-right">
            <span class="env-chip">Sistem Aktif</span>
            <button class="theme-switch" id="themeToggle" type="button" title="Ganti tema" aria-label="Ganti tema terang/gelap"></button>
            <span class="topbar-user" id="topbarUser"></span>
            <button class="icon-btn topbar-logout" id="topbarLogout" type="button" title="Keluar / ganti akun" aria-label="Keluar">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg>
            </button>
          </div>
        </header>

        <main class="content" id="view"></main>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="/app.js"></script>
</body>
</html>
